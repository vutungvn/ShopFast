# Lớp phủ HTTPS cho server, dùng kèm docker-compose.prod.yml:
#   docker compose -f docker-compose.prod.yml -f docker-compose.https.yml --env-file .env.prod up -d
services:
  web:
    ports:
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      # Image Nginx render template này thành /etc/nginx/conf.d/default.conf (thay bản HTTP có trong image)
      - ./deploy/nginx/https.conf.template:/etc/nginx/templates/default.conf.template:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro

  # Kiểm tra gia hạn 12 giờ/lần; certbot chỉ gia hạn khi chứng chỉ còn dưới 30 ngày
  certbot:
    image: certbot/certbot:v2.11.0
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done",
      ]

volumes:
  letsencrypt:
  certbot-www:
