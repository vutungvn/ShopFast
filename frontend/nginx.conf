server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 1m;

  # Header bảo mật. Không dùng add_header trong các location bên dưới,
  # vì location có add_header thì sẽ không kế thừa các header này
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Phân giải tên "api" mỗi lần gọi qua DNS nội bộ của Docker: api khởi động lại (đổi IP) thì không lỗi 502,
  # và Nginx vẫn chạy được dù api chưa sẵn sàng
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://api:3000;

  location /api/ {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Kiểm tra sức khoẻ (DB + Redis) và Swagger (/docs, /docs-json)
  location = /health { proxy_pass $api; }
  location /docs     { proxy_pass $api; proxy_set_header Host $host; }

  # File build có hash trong tên: cache lâu
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # SPA: mọi đường dẫn khác trả về index.html; không cache để deploy bản mới là thấy ngay
  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
